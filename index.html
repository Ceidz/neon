if(n=='main')h=`<h1>NEON RUNNER</h1><div class=sub>Best ${sv.best} · ${I.coin} ${sv.coins}</div><div class=sub style='font-size:13px'>Tap left / right or use ← → · dodge red, grab cyan</div>`+bt('PLAY','reset()','p')+bt('Customize',`show('cus')`)+bt('Goals',`show('goals')`)+bt('Shop',`show('shop')`)+bt('Settings',`show('set')`)+bt('Patch Notes',`show('notes')`);
if(n=='over')h=`<h1>CRASHED</h1>${a.nb?'<div style=color:#ffd400>'+I.trophy+' New best!</div>':''}<div class=sub>Score ${a.s} · ${run} orbs${a.b?` · +${a.b} bonus`:''}</div>`+bt('RETRY','reset()','p')+bt('Menu',`show('main')`);
if(n=='cus')h='<h2>Customize</h2><h3>Ship colour</h3><div class=g>'+SK.map((s,i)=>{const o=sv.ownS.includes(i);return ch(s[0]+(o?'':' '+I.lock),hx(s[1]),sv.skin==i,`eq('skin',${i})`,!o)}).join('')+'</div><h3>Trail</h3><div class=g>'+TR.map((s,i)=>{const o=sv.ownT.includes(i);return ch(s[0]+(o?'':' '+I.lock),hx(s[1]),sv.trail==i,`eq('trail',${i})`,!o)}).join('')+'</div>'+bt('Back',`show('main')`);
if(n=='shop')h=`<h2>Shop</h2><div class=sub>${I.coin} ${sv.coins}</div><h3>Ship colours</h3><div class=g>`+SK.map((s,i)=>{const o=sv.ownS.includes(i);return ch(o?s[0]+' '+I.check:s[0]+' · '+s[2]+' '+I.coin,hx(s[1]),0,`buy('s',${i})`,o)}).join('')+'</div><h3>Trails</h3><div class=g>'+TR.map((s,i)=>{const o=sv.ownT.includes(i);return ch(o?s[0]+' '+I.check:s[0]+' · '+s[3]+' '+I.coin,hx(s[1]),0,`buy('t',${i})`,o)}).join('')+'</div><h3>Power-up</h3><div class=g>'+ch(`Shield ×${sv.shield} · 30 ${I.coin}`,'#66ffff',0,`buy('h',0)`)+'</div>'+bt('Back',`show('main')`);
if(n=='set'){const tb=(l,k)=>bt(`${l}: ${sv[k]?'ON':'OFF'}`,`tg('${k}')`);h='<h2>Settings</h2>'+tb('Screen effects','bloom')+tb('Glow','glow')+tb('High resolution','hq')+tb('Sound','snd')+bt(rc?'Tap again to confirm':'Reset progress','rst()')+bt('Back',`show('main')`)}
if(n=='goals')h='<h2>Goals</h2>'+GOALS.map((q,i)=>{const d=sv.goals.includes(i),p=Math.min(q[2],q[1]=='s'?sv.best:q[1]=='o'?sv.to:sv.tr);return `<div class='gl${d?' dn':''}'><span>${q[0]}</span><b>${d?I.check:p+'/'+q[2]} · ${q[3]} ${I.coin}</b></div>`}).join('')+bt('Back',`show('main')`);
if(n=='notes'){sv.ver=VER;save();h='<h2>Patch Notes</h2>'+NOTES.map(([v,t,l])=>`<h3>v${v} · ${t}</h3><ul class=nl>${l.map(i=>'<li>'+i+'</li>').join('')}</ul>`).join('')+bt('Continue',`show('main')`,'p')}M.innerHTML=h;M.style.display='flex'}
function buy(k,i){const o=k=='s'?sv.ownS:sv.ownT,p=k=='h'?30:(k=='s'?SK:TR)[i][k=='s'?2:3];if(sv.coins<p||(k!='h'&&o.includes(i))){beep(120,.2);toast(sv.coins<p?'Not enough coins':'Already owned');return}sv.coins-=p;if(k=='h')sv.shield++;else{o.push(i);sv[k=='s'?'skin':'trail']=i;skin()}upd();beep(660,.1);toast('Purchased!');show('shop')}
function eq(k,i){sv[k]=i;skin();save();show('cus')}
function tg(k){sv[k]=!sv[k];save();if(k=='hq')fit();show('set')}
function rst(){if(!rc){rc=1;show('set');return}try{localStorage.removeItem('nr1')}catch(e){}location.reload()}
const PW=document.getElementById('pw'),PB=document.getElementById('pb'),TT=document.createElement('div');TT.id='tt';document.body.append(TT);
const F=document.createElement('div');F.id='fl';document.body.append(F);
function flash(c){F.style.transition='none';F.style.background=c;F.style.opacity=.28;F.offsetWidth;F.style.transition='opacity .45s';F.style.opacity=0}
function pop(t,c){const v=ship.position.clone().project(cam),e=document.createElement('div');e.className='pp';e.textContent=t;e.style.cssText=`left:${(v.x+1)/2*innerWidth}px;top:${(1-v.y)/2*innerHeight-40}px;color:${c}`;document.body.append(e);setTimeout(()=>e.remove(),700)}
function toast(s){TT.textContent=s;TT.style.opacity=1;clearTimeout(TT.k);TT.k=setTimeout(()=>TT.style.opacity=0,1400)}
function pause(){paused=true;show('pause')}
function resume(){paused=false;M.style.display='none';PB.hidden=false}
function tp(){alive&&!paused&&pause()}
function quit(){paused=false;alive=false;ents.forEach(e=>sc.remove(e.m));ents.length=0;shm.visible=false;show('main')}
addEventListener('blur',()=>{alive&&!paused&&pause()});addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden&&alive&&!paused)pause()});
skin();upd();show(sv.ver!=VER?'notes':'main');window.__ok=1;
</script></body></html>
